# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish

on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  Publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Configure Git"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4

      - name: "🗃️ Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: "📐 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🏗️ Build"
        run: pnpm build

      - name: "🖌️ Lint"
        run: pnpm lint

      - name: "✅ Test"
        run: pnpm test

      - name: "📤 Publish"
        run: pnpm changeset publish

      - name: "🏷️ Push tags"
        run: git push --tags

      # `changeset publish` creates the v<version> tag only when it actually
      # publishes; the checkout fetches no tags, so its presence means a new
      # version was released on this run.
      - name: "🔍 Detect published version"
        id: release
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ -n "$(git tag --list "v$VERSION")" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "📦 Pack MCPB bundle"
        if: steps.release.outputs.published == 'true'
        run: pnpm mcpb

      - name: "🚀 Create GitHub release"
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.release.outputs.version }}" \
            dist/elgato_stream_deck-*.mcpb \
            --title "v${{ steps.release.outputs.version }}" \
            --generate-notes
